<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - سبا</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <div class="login-image-overlay"></div>
            <div class="login-content">
                <h1 class="brand-title">سبا</h1>
                <p class="brand-subtitle">تجربة فريدة من الاسترخاء والجمال</p>
            </div>
        </div>
        
        <div class="login-right">
            <div class="login-form-container">
                <div class="login-header">
                    <h2>مرحباً بك</h2>
                    <p>قم بتسجيل الدخول للوصول إلى حسابك</p>
                </div>
                
                <form id="loginForm" class="login-form" method="POST" action="php/login.php">
                    <div id="messageBox" class="message-box" style="display: none;"></div>
                    
                    <div class="form-group">
                        <label for="username">اسم المستخدم</label>
                        <input type="text" id="username" name="username" placeholder="أدخل اسم المستخدم" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">كلمة المرور</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" placeholder="••••••••" required>
                            <button type="button" class="password-toggle" id="passwordToggle">👁️</button>
                        </div>
                    </div>
                    
                    <div class="form-options">
                        <label class="checkbox-container">
                            <input type="checkbox" id="remember" name="remember">
                            <span class="checkmark"></span>
                            تذكرني
                        </label>
                    </div>
                    
                    <button type="submit" class="login-button" id="loginBtn">تسجيل الدخول</button>
                    
                    <div class="divider">
                        <span>أو</span>
                    </div>
                    
                    <div class="signup-link">
                        <p>ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="js/login.js"></script>
</body>
</html>
